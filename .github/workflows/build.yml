name: build-geo

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources/**"
      - "tools/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -v

      - name: Build geosite.dat
        run: python3 tools/build_geosite.py

      - name: Build geoip.dat
        run: python3 tools/build_geoip.py

      - name: Write SHA-256 sidecars
        run: |
          cd dist
          sha256sum geosite.dat | cut -d' ' -f1 > geosite.dat.sha256
          sha256sum geoip.dat   | cut -d' ' -f1 > geoip.dat.sha256
          cat geosite.dat.sha256 geoip.dat.sha256

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: rebuild geo files"
            git push
          fi
